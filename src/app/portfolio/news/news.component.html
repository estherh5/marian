<div id="articles-container">
  <h3 class="section-title">Recent News</h3>

  <div id="articles">
    @for (article of news(); track article.id) {
      <div class="article">

        <!-- Article thumbnail that links to article -->
        <!-- Duplicates the headline link, so it is skipped by keyboard and screen readers -->
        <a href="{{ article.url }}" target="_blank" rel="noopener" class="article-image" tabindex="-1" aria-hidden="true">
          @if (article.image) {
            <img src="{{ article.image }}" alt="" loading="lazy" (error)="hideImage($event)">
          }
        </a>

        <div class="article-info">

          <!-- Article source | number of minutes/hours/days ago that article was published -->
          <div class="source-name">
            <a href="{{ article.url }}" target="_blank" rel="noopener">{{ article.source }}</a> | {{ toTimeAgo(article.datetime) }}
          </div>

          <!-- Article headline (trimmed if > 100 characters) -->
          <div class="article-title">
            <a href="{{ article.url }}" target="_blank" rel="noopener" title="{{ article.headline }}">
              {{ article.headline.length > 100 ? article.headline.slice(0, 100) + '...' : article.headline }}
            </a>
          </div>

          <!-- Related stocks -->
          <div id="related-container">
            @for (related of article.related; track related) {
              <button type="button" class="related" (click)="selectStock(related)" [attr.aria-label]="'Add ' + related">{{ related }}</button>
            }
          </div>
        </div>

      </div>
    }
  </div>

</div>
