<div class="chart-container">
  <div class="title-row">
    <h1 class="section-title">Net Equity</h1>

    <!-- Show the y-axis as a percent change or in dollars -->
    <div class="units" role="group" aria-label="Units">
      <button type="button" [attr.aria-pressed]="type === 'percent'" (click)="setAxis('percent')">%</button>
      <button type="button" [attr.aria-pressed]="type === 'price'" (click)="setAxis('price')">$</button>
    </div>
  </div>

  <!-- Period selector toolbar -->
  <div class="chart-toolbar" #toolbar></div>

  <!-- Net equity chart container -->
  <div id="net-chart" class="chartdiv" #chartdiv></div>
</div>
