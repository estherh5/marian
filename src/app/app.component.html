<app-header
  [isLandingPage]="isLandingPage">
</app-header>

<app-search
  [isLandingPage]="isLandingPage"
  [selectedStocks]="selectedStocks()"
  (stockSelected)="addNewStock($event)">
</app-search>

<div id="main-container">
  @for (selectedStock of selectedStocks(); track selectedStock.symbol) {
    <app-portfolio
      id="{{ selectedStock.symbol }}"
      [selectedStock]="selectedStock"
      (chartUpdated)="onPriceChartUpdated($event)"
      (shareEntered)="addNewShare($event)"
      (shareRemoved)="removeShare($event)"
      (stockRemoved)="removeStock($event)"
      (retried)="retry($event)"
      (stockSelected)="addNewStock($event)">
    </app-portfolio>
  }

  @if (selectedStocks().length > 0 && renderNetChart) {
    <app-net-chart
      id="net-equity"
      [selectedStocks]="selectedStocks()"
      [update]="updateNetChart"
      (chartUpdated)="onNetChartUpdated()"
      (optionUpdated)="displayNetChart()">
    </app-net-chart>
  }

  <app-footer></app-footer>
</div>

<!-- Undo the last removal -->
<div class="undo-bar" [class.open]="removed() || netChartNotice()" role="status" aria-live="polite">
  @if (removed(); as last) {
    <span>Removed {{ last.stock.name }} ({{ last.stock.symbol }}).</span>
    <button type="button" (click)="undoRemove()">Undo</button>
  } @else if (netChartNotice()) {
    <span>Your net equity is charted below your stocks.</span>
    <button type="button" (click)="showNetChart()">Show</button>
  }
</div>
